<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Visualization Controls</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="usb-navbar">
        <span class="usb-navbar-title">USB LED</span>
        <div class="usb-navbar-panels">
            <div class="usb-panel-slot" id="panelSlotLeft">
                <label>Left</label>
                <span class="usb-panel-status" id="statusLeft">--</span>
                <button id="connectLeft">Connect</button>
            </div>
            <div class="usb-panel-slot" id="panelSlotCenter">
                <label>Center</label>
                <span class="usb-panel-status" id="statusCenter">--</span>
                <button id="connectCenter">Connect</button>
            </div>
            <div class="usb-panel-slot" id="panelSlotRight">
                <label>Right</label>
                <span class="usb-panel-status" id="statusRight">--</span>
                <button id="connectRight">Connect</button>
            </div>
        </div>
        <div class="usb-navbar-stream">
            <button id="usbStreamBtn" disabled>Start Streaming</button>
            <span class="usb-fps-display">FPS <span id="usbFps">0</span></span>
        </div>
        <div class="navbar-sep"></div>
        <div class="navbar-export">
            <label>Loops</label>
            <input type="number" id="exportLoops" min="1" max="8" value="1" step="1">
            <span id="exportInfo" class="export-info-text">--</span>
            <button id="exportBinBtn" class="export-btn">Export BIN</button>
            <div class="export-progress" id="exportProgress" style="display:none">
                <div class="export-progress-bar">
                    <div class="export-progress-fill" id="exportProgressFill"></div>
                </div>
                <span class="export-progress-text" id="exportProgressText">0%</span>
            </div>
        </div>
    </nav>

    <canvas id="game"></canvas>

    <div class="controls">
        <h2>3D Controls</h2>

        <div class="control-group">
            <label>
                X-Axis Spin Speed
                <span class="value-display" id="speedXValue">0.00x</span>
            </label>
            <input type="range" id="speedXSlider" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <label>
                Y-Axis Spin Speed
                <span class="value-display" id="speedYValue">0.00x</span>
            </label>
            <input type="range" id="speedYSlider" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <label>
                Z-Axis Spin Speed
                <span class="value-display" id="speedZValue">0.00x</span>
            </label>
            <input type="range" id="speedZSlider" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <label>
                X-Axis Angle
                <span class="value-display" id="angleXValue">0°</span>
            </label>
            <input type="range" id="angleXSlider" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <label>
                Y-Axis Angle
                <span class="value-display" id="angleYValue">0°</span>
            </label>
            <input type="range" id="angleYSlider" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <label>
                Z-Axis Angle
                <span class="value-display" id="angleZValue">0°</span>
            </label>
            <input type="range" id="angleZSlider" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <label>
                Zoom (Depth)
                <span class="value-display" id="zoomValue">0.50</span>
            </label>
            <input type="range" id="zoomSlider" min="0.1" max="5" step="0.01" value="0.5">
        </div>

        <div class="control-group">
            <label>Zoom Automation</label>
            <button id="zoomAutoToggle" style="margin-top: 0;">Off</button>
        </div>

        <div class="control-group">
            <label>
                Min Zoom
                <input type="number" class="inline-input" id="zoomMinInput" min="0.1" max="10" step="0.01" value="0.8">
            </label>
            <input type="range" id="zoomMinSlider" min="0.1" max="10" step="0.01" value="0.8">
        </div>

        <div class="control-group">
            <label>
                Max Zoom
                <input type="number" class="inline-input" id="zoomMaxInput" min="0.1" max="10" step="0.01" value="1.5">
            </label>
            <input type="range" id="zoomMaxSlider" min="0.1" max="10" step="0.01" value="1.5">
        </div>

        <div class="control-group">
            <label>
                Zoom Speed
                <span class="value-display" id="zoomSpeedValue">1.0x</span>
            </label>
            <input type="range" id="zoomSpeedSlider" min="0.1" max="5" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>
                FOV
                <span class="value-display" id="fovValue">30°</span>
            </label>
            <input type="range" id="fovSlider" min="20" max="120" step="1" value="30">
        </div>

        <div class="control-group">
            <label>
                Y Position
                <span class="value-display" id="offsetYValue">0.00</span>
            </label>
            <input type="range" id="offsetYSlider" min="-2" max="2" step="0.05" value="0">
        </div>

        <div class="control-group">
            <label>Y Position Automation</label>
            <button id="offsetYAutoToggle" style="margin-top: 0;">Off</button>
        </div>

        <div class="control-group">
            <label>
                Min Y
                <input type="number" class="inline-input" id="offsetYMinInput" min="-2" max="2" step="0.05" value="-0.5">
            </label>
            <input type="range" id="offsetYMinSlider" min="-2" max="2" step="0.05" value="-0.5">
        </div>

        <div class="control-group">
            <label>
                Max Y
                <input type="number" class="inline-input" id="offsetYMaxInput" min="-2" max="2" step="0.05" value="0.5">
            </label>
            <input type="range" id="offsetYMaxSlider" min="-2" max="2" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <label>
                Y Speed
                <span class="value-display" id="offsetYSpeedValue">1.0x</span>
            </label>
            <input type="range" id="offsetYSpeedSlider" min="0.1" max="5" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>Render Mode</label>
            <button id="solidToggle" style="margin-top: 0;">Wireframe</button>
        </div>

        <button id="resetBtn">Reset All</button>
    </div>

    <div class="model-controls">
        <h2>Model Editor</h2>

        <div class="control-group">
            <label>Object Count</label>
            <div class="color-count-btns">
                <button class="obj-count-btn active" data-count="1">1</button>
                <button class="obj-count-btn" data-count="2">2</button>
            </div>
        </div>

        <div class="control-group">
            <label>Object 1 Preset</label>
            <select id="modelPreset">
                <option value="penguin">Penguin</option>
                <option value="cube">Cube</option>
                <option value="hollowCube">Hollow Cube</option>
                <option value="pyramid">Pyramid</option>
                <option value="octahedron">Octahedron</option>
                <option value="dodecahedron">Dodecahedron</option>
                <option value="icosahedron">Icosahedron</option>
                <option value="torus">Torus</option>
                <option value="hand">Hand</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="control-group">
            <label>
                Object 1 Scale
                <span class="value-display" id="obj1ScaleValue">1.00x</span>
            </label>
            <input type="range" id="obj1ScaleSlider" min="0.1" max="3" step="0.01" value="1">
        </div>

        <div class="control-group" id="obj2PresetGroup" style="display: none;">
            <label>Object 2 Preset</label>
            <select id="modelPreset2">
                <option value="penguin">Penguin</option>
                <option value="cube">Cube</option>
                <option value="hollowCube">Hollow Cube</option>
                <option value="pyramid">Pyramid</option>
                <option value="octahedron">Octahedron</option>
                <option value="dodecahedron">Dodecahedron</option>
                <option value="icosahedron">Icosahedron</option>
                <option value="torus" selected>Torus</option>
                <option value="hand">Hand</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="control-group" id="obj2ScaleGroup" style="display: none;">
            <label>
                Object 2 Scale
                <span class="value-display" id="obj2ScaleValue">1.00x</span>
            </label>
            <input type="range" id="obj2ScaleSlider" min="0.1" max="3" step="0.01" value="1">
        </div>

        <div class="control-group" id="objDistanceGroup" style="display: none;">
            <label>
                Y Distance
                <span class="value-display" id="objDistanceValue">0.50</span>
            </label>
            <input type="range" id="objDistanceSlider" min="0" max="2" step="0.01" value="0.5">
        </div>

        <div class="control-group" id="objDistAutoGroup" style="display: none;">
            <label>Distance Automation</label>
            <button id="objDistAutoToggle" style="margin-top: 0;">Off</button>
        </div>

        <div class="control-group" id="objDistMinGroup" style="display: none;">
            <label>
                Min Distance
                <input type="number" class="inline-input" id="objDistMinInput" min="0" max="5" step="0.01" value="0.10">
            </label>
            <input type="range" id="objDistMinSlider" min="0" max="5" step="0.01" value="0.1">
        </div>

        <div class="control-group" id="objDistMaxGroup" style="display: none;">
            <label>
                Max Distance
                <input type="number" class="inline-input" id="objDistMaxInput" min="0" max="5" step="0.01" value="1.00">
            </label>
            <input type="range" id="objDistMaxSlider" min="0" max="5" step="0.01" value="1">
        </div>

        <div class="control-group" id="objDistSpeedGroup" style="display: none;">
            <label>
                Distance Speed
                <span class="value-display" id="objDistSpeedValue">1.0x</span>
            </label>
            <input type="range" id="objDistSpeedSlider" min="0.1" max="5" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>Morph To</label>
            <button id="morphToggle" style="margin-top: 0;">Off</button>
            <select id="morphTarget">
                <option value="penguin">Penguin</option>
                <option value="cube">Cube</option>
                <option value="hollowCube">Hollow Cube</option>
                <option value="pyramid" selected>Pyramid</option>
                <option value="octahedron">Octahedron</option>
                <option value="dodecahedron">Dodecahedron</option>
                <option value="icosahedron">Icosahedron</option>
                <option value="torus">Torus</option>
                <option value="hand">Hand</option>
            </select>
        </div>

        <div class="control-group">
            <label>
                Morph Speed
                <span class="value-display" id="morphSpeedValue">0.5x</span>
            </label>
            <input type="range" id="morphSpeedSlider" min="0.1" max="5" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>Edit Model</label>
            <button id="editModelBtn" style="margin-top: 0;">Edit Current Model</button>
            <button id="savePresetBtn" style="margin-top: 5px;">Save as Preset</button>
        </div>
    </div>

    <div class="appearance-controls">
        <h2>Appearance</h2>

        <div class="control-group">
            <label>
                Line Thickness
                <span class="value-display" id="thicknessValue">10.0px</span>
            </label>
            <input type="range" id="thicknessSlider" min="1" max="30" step="0.5" value="10">
        </div>

        <div class="control-group">
            <label>
                Scale Thickness with Zoom
                <button id="thicknessScaleToggle" class="toggle-btn">Off</button>
            </label>
        </div>

        <div class="control-group" id="thicknessScaleGroup" style="display: none;">
            <label>
                Scale Amount
                <span class="value-display" id="thicknessScaleValue">50%</span>
            </label>
            <input type="range" id="thicknessScaleSlider" min="0" max="200" step="5" value="50">
        </div>

        <div class="control-group">
            <label>Color Count</label>
            <div class="color-count-btns">
                <button class="color-count-btn active" data-count="1">1</button>
                <button class="color-count-btn" data-count="2">2</button>
                <button class="color-count-btn" data-count="3">3</button>
                <button class="color-count-btn" data-count="4">4</button>
            </div>
        </div>

        <div class="control-group" id="color1Group">
            <label>Color 1</label>
            <input type="color" id="colorPicker1" value="#ff0000"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group" id="color2Group" style="display:none">
            <label>Color 2</label>
            <input type="color" id="colorPicker2" value="#00ff00"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group" id="color3Group" style="display:none">
            <label>Color 3</label>
            <input type="color" id="colorPicker3" value="#0000ff"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group" id="color4Group" style="display:none">
            <label>Color 4</label>
            <input type="color" id="colorPicker4" value="#ffff00"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group">
            <label>Color Gradient</label>
            <button id="gradientToggle" style="margin-top: 0;">Off</button>
        </div>

        <div class="control-group">
            <label>Stroke Color (Solid Mode)</label>
            <input type="color" id="strokeColorPicker" value="#000000"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group">
            <label>
                Lighting Contrast
                <span class="value-display" id="contrastValue">70%</span>
            </label>
            <input type="range" id="contrastSlider" min="0" max="100" step="1" value="70">
        </div>

        <div class="control-group">
            <label>Background Color</label>
            <input type="color" id="backgroundPicker" value="#000000"
                style="width: 100%; height: 24px; cursor: pointer; background: #2a2a2a; border: 1px solid #0fff83; border-radius: 3px;">
        </div>

        <div class="control-group">
            <label>Parallax Stars</label>
            <button id="starsToggle" style="margin-top: 0;">Off</button>
        </div>

        <div class="control-group">
            <label>
                Star Direction & Speed
                <span class="value-display" id="starSpeedDisplay">0.0, 0.0</span>
            </label>
            <div class="joystick-pad" id="starJoystick">
                <div class="joystick-axis joystick-axis-x"></div>
                <div class="joystick-axis joystick-axis-y"></div>
                <div class="joystick-dot" id="starJoystickDot"></div>
            </div>
        </div>

        <div class="control-group">
            <label>Star Color</label>
            <input type="color" id="starColorPicker" value="#ffffff">
        </div>

        <div class="control-group">
            <label>
                Star Depth Contrast
                <span class="value-display" id="starContrastValue">100%</span>
            </label>
            <input type="range" id="starContrastSlider" min="0" max="100" step="1" value="100">
        </div>

        <div class="control-group">
            <label>
                Star Size
                <span class="value-display" id="starSizeValue">1.0x</span>
            </label>
            <input type="range" id="starSizeSlider" min="1" max="10" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>
                Star Count
                <span class="value-display" id="starCountValue">200</span>
            </label>
            <input type="range" id="starCountSlider" min="10" max="1000" step="10" value="200">
        </div>
    </div>

    <div class="sequencer-controls">
        <h2>Sequencer</h2>

        <div class="seq-transport">
            <button id="seqPlayBtn" class="seq-play-btn">Play</button>
            <div class="seq-param">
                <label>BPM</label>
                <input type="number" id="seqTempo" value="120" min="20" max="300">
            </div>
            <div class="seq-param">
                <label>Vol <span id="seqVolumeValue">80%</span></label>
                <input type="range" id="seqVolume" min="0" max="1" step="0.05" value="0.8">
            </div>
            <div class="seq-param">
                <label>Steps</label>
                <div class="seq-btn-group">
                    <button class="seq-steps-btn active" data-steps="16">16</button>
                    <button class="seq-steps-btn" data-steps="32">32</button>
                    <button class="seq-steps-btn" data-steps="64">64</button>
                </div>
            </div>
            <div class="seq-param">
                <label>Page</label>
                <div class="seq-btn-group">
                    <button class="seq-page-btn active" data-page="0">1</button>
                    <button class="seq-page-btn" data-page="1" style="display:none">2</button>
                    <button class="seq-page-btn" data-page="2" style="display:none">3</button>
                    <button class="seq-page-btn" data-page="3" style="display:none">4</button>
                </div>
            </div>
        </div>

        <div class="seq-sample-player">
            <span class="seq-sample-label">Backtrack</span>
            <label class="seq-file-btn">
                Load
                <input type="file" id="sampleFileInput" accept="audio/*" hidden>
            </label>
            <span class="seq-sample-name" id="sampleFileName">No file loaded</span>
            <div class="seq-param">
                <label>Vol <span id="sampleVolumeValue">80%</span></label>
                <input type="range" id="sampleVolume" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>

        <div class="seq-track">
            <div class="seq-track-row">
                <span class="seq-track-label" style="color:#ff6633">KICK</span>
                <div class="seq-steps" id="seq-steps-kick"></div>
            </div>
            <div class="seq-mod-row">
                <label>Mod</label>
                <select id="seq-mod-target-kick"></select>
                <label>Amt <span id="seq-mod-amount-val-kick">-0.30</span></label>
                <input type="range" id="seq-mod-amount-kick" min="-2" max="2" step="0.05" value="-0.3">
                <label>Return <span id="seq-mod-recovery-val-kick">0.50</span></label>
                <input type="range" id="seq-mod-recovery-kick" min="0.05" max="1" step="0.05" value="0.5">
                <span class="seq-mod-sep"></span>
                <label>Color</label>
                <button id="seq-color-toggle-kick" class="seq-color-toggle">Off</button>
                <select id="seq-color-target-kick" class="seq-color-target"></select>
                <input type="color" id="seq-color-picker-kick" value="#ff2200" class="seq-color-picker">
                <label>Fade <span id="seq-color-return-val-kick">0.30</span></label>
                <input type="range" id="seq-color-return-kick" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Solid</label>
                <button id="seq-solid-toggle-kick" class="seq-color-toggle">Off</button>
                <label>Fade <span id="seq-solid-return-val-kick">0.30</span></label>
                <input type="range" id="seq-solid-return-kick" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Distort</label>
                <button id="seq-distort-toggle-kick" class="seq-color-toggle">Off</button>
                <label>Amt <span id="seq-distort-amount-val-kick">0.15</span></label>
                <input type="range" id="seq-distort-amount-kick" min="0.02" max="0.5" step="0.01" value="0.15">
                <label>Fade <span id="seq-distort-return-val-kick">0.40</span></label>
                <input type="range" id="seq-distort-return-kick" min="0.02" max="1" step="0.02" value="0.4">
                <span class="seq-mod-sep"></span>
                <label>Morph</label>
                <button id="seq-morph-toggle-kick" class="seq-color-toggle">Off</button>
                <select id="seq-morph-target-kick" class="seq-morph-target"></select>
                <label>Hold <span id="seq-morph-hold-val-kick">0.15</span></label>
                <input type="range" id="seq-morph-hold-kick" min="0" max="1" step="0.05" value="0.15">
                <label>Fade <span id="seq-morph-return-val-kick">0.30</span></label>
                <input type="range" id="seq-morph-return-kick" min="0.02" max="1" step="0.02" value="0.3">
            </div>
        </div>

        <div class="seq-track">
            <div class="seq-track-row">
                <span class="seq-track-label" style="color:#33ffff">HIHAT</span>
                <div class="seq-steps" id="seq-steps-hihat"></div>
            </div>
            <div class="seq-mod-row">
                <label>Mod</label>
                <select id="seq-mod-target-hihat"></select>
                <label>Amt <span id="seq-mod-amount-val-hihat">0.50</span></label>
                <input type="range" id="seq-mod-amount-hihat" min="-2" max="2" step="0.05" value="0.5">
                <label>Return <span id="seq-mod-recovery-val-hihat">0.70</span></label>
                <input type="range" id="seq-mod-recovery-hihat" min="0.05" max="1" step="0.05" value="0.7">
                <span class="seq-mod-sep"></span>
                <label>Color</label>
                <button id="seq-color-toggle-hihat" class="seq-color-toggle">Off</button>
                <select id="seq-color-target-hihat" class="seq-color-target"></select>
                <input type="color" id="seq-color-picker-hihat" value="#00ccff" class="seq-color-picker">
                <label>Fade <span id="seq-color-return-val-hihat">0.30</span></label>
                <input type="range" id="seq-color-return-hihat" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Solid</label>
                <button id="seq-solid-toggle-hihat" class="seq-color-toggle">Off</button>
                <label>Fade <span id="seq-solid-return-val-hihat">0.30</span></label>
                <input type="range" id="seq-solid-return-hihat" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Distort</label>
                <button id="seq-distort-toggle-hihat" class="seq-color-toggle">Off</button>
                <label>Amt <span id="seq-distort-amount-val-hihat">0.15</span></label>
                <input type="range" id="seq-distort-amount-hihat" min="0.02" max="0.5" step="0.01" value="0.15">
                <label>Fade <span id="seq-distort-return-val-hihat">0.40</span></label>
                <input type="range" id="seq-distort-return-hihat" min="0.02" max="1" step="0.02" value="0.4">
                <span class="seq-mod-sep"></span>
                <label>Morph</label>
                <button id="seq-morph-toggle-hihat" class="seq-color-toggle">Off</button>
                <select id="seq-morph-target-hihat" class="seq-morph-target"></select>
                <label>Hold <span id="seq-morph-hold-val-hihat">0.15</span></label>
                <input type="range" id="seq-morph-hold-hihat" min="0" max="1" step="0.05" value="0.15">
                <label>Fade <span id="seq-morph-return-val-hihat">0.30</span></label>
                <input type="range" id="seq-morph-return-hihat" min="0.02" max="1" step="0.02" value="0.3">
            </div>
        </div>

        <div class="seq-track">
            <div class="seq-track-row">
                <span class="seq-track-label" style="color:#ffff33">SNARE</span>
                <div class="seq-steps" id="seq-steps-snare"></div>
            </div>
            <div class="seq-mod-row">
                <label>Mod</label>
                <select id="seq-mod-target-snare"></select>
                <label>Amt <span id="seq-mod-amount-val-snare">0.50</span></label>
                <input type="range" id="seq-mod-amount-snare" min="-2" max="2" step="0.05" value="0.5">
                <label>Return <span id="seq-mod-recovery-val-snare">0.50</span></label>
                <input type="range" id="seq-mod-recovery-snare" min="0.05" max="1" step="0.05" value="0.5">
                <span class="seq-mod-sep"></span>
                <label>Color</label>
                <button id="seq-color-toggle-snare" class="seq-color-toggle">Off</button>
                <select id="seq-color-target-snare" class="seq-color-target"></select>
                <input type="color" id="seq-color-picker-snare" value="#0044ff" class="seq-color-picker">
                <label>Fade <span id="seq-color-return-val-snare">0.30</span></label>
                <input type="range" id="seq-color-return-snare" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Solid</label>
                <button id="seq-solid-toggle-snare" class="seq-color-toggle">Off</button>
                <label>Fade <span id="seq-solid-return-val-snare">0.30</span></label>
                <input type="range" id="seq-solid-return-snare" min="0.02" max="1" step="0.02" value="0.3">
                <span class="seq-mod-sep"></span>
                <label>Distort</label>
                <button id="seq-distort-toggle-snare" class="seq-color-toggle">Off</button>
                <label>Amt <span id="seq-distort-amount-val-snare">0.15</span></label>
                <input type="range" id="seq-distort-amount-snare" min="0.02" max="0.5" step="0.01" value="0.15">
                <label>Fade <span id="seq-distort-return-val-snare">0.40</span></label>
                <input type="range" id="seq-distort-return-snare" min="0.02" max="1" step="0.02" value="0.4">
                <span class="seq-mod-sep"></span>
                <label>Morph</label>
                <button id="seq-morph-toggle-snare" class="seq-color-toggle">Off</button>
                <select id="seq-morph-target-snare" class="seq-morph-target"></select>
                <label>Hold <span id="seq-morph-hold-val-snare">0.15</span></label>
                <input type="range" id="seq-morph-hold-snare" min="0" max="1" step="0.05" value="0.15">
                <label>Fade <span id="seq-morph-return-val-snare">0.30</span></label>
                <input type="range" id="seq-morph-return-snare" min="0.02" max="1" step="0.02" value="0.3">
            </div>
        </div>
    </div>

    <!-- Model Editor Modal -->
    <div id="modelEditorModal" class="modal">
        <div class="modal-content">
            <h3>Custom Model Editor</h3>
            <p style="font-size: 12px; color: #999;">Edit vertices (vs) and faces (fs) in JSON format. Each vertex has
                x, y, z coordinates. Each face is an array of vertex indices.</p>
            <textarea id="modelJsonEditor" spellcheck="false"></textarea>
            <div class="error-message" id="jsonError"></div>
            <div class="modal-buttons">
                <button id="applyModelBtn">Apply Model</button>
                <button id="cancelModelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="presets.js"></script>
    <script src="usb-stream.js"></script>
    <script src="sequencer.js"></script>
    <script src="index.js"></script>
    <script src="export.js"></script>
    <script>BinExport.init();</script>
</body>

</html>
